# Netlify configuration for the Grunion RFC site.
# This is a plain static site — no build step. Netlify just serves the files as-is.

[build]
  publish = "."
  command = ""

# The Drive API key in site.js is a public, browser-side, read-only key
# (restricted in Google Cloud to the Drive API + this site's domain), so it
# is safe to ship. Tell Netlify's secrets scanner not to fail the deploy on it.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "site.js"

# Let visitors reach the '78 Club page at /the-78-club (without the .html)
[[redirects]]
  from = "/the-78-club"
  to = "/the-78-club.html"
  status = 200

# Serve The MERchives at /MERchives (without the .html)
[[redirects]]
  from = "/MERchives"
  to = "/MERchives.html"
  status = 200

# Send the old /members URL to the renamed MERchives page
[[redirects]]
  from = "/members"
  to = "/MERchives.html"
  status = 301

# Pretty URLs for the History and Fossils pages (matches /the-78-club and /MERchives)
[[redirects]]
  from = "/history"
  to = "/history.html"
  status = 200

[[redirects]]
  from = "/fossils"
  to = "/fossils.html"
  status = 200

# Newsletter confirmation page (Campaign Monitor redirects here after signup)
[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

# ---- Paid-ad landing pages ---------------------------------------------------
# /play and /coach are the destinations for the 2027 paid campaigns. Google
# Search ads need a real landing page (Meta Instant Forms do not), and Google
# cannot count a lead-form conversion without a distinct thank-you URL — hence
# the -thanks pages. Deliberately not in the site nav: on a paid landing page
# every nav link is an exit.
[[redirects]]
  from = "/play"
  to = "/play.html"
  status = 200

[[redirects]]
  from = "/coach"
  to = "/coach.html"
  status = 200

# Netlify Forms redirect here on success; these URLs are the Google Ads
# conversion triggers. Keep the paths stable — changing one silently stops
# conversion counting.
[[redirects]]
  from = "/play-thanks"
  to = "/play-thanks.html"
  status = 200

[[redirects]]
  from = "/coach-thanks"
  to = "/coach-thanks.html"
  status = 200

# Site-wide security headers. Deliberately conservative: no Content-Security-Policy,
# because the Campaign Monitor archive (document.write), inline styles/handlers, and
# third-party sponsor/Google/Facebook assets would make a strict CSP break silently.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Cache images for a day. Long enough to speed up repeat visits; short enough
# that the "replace a photo with the same filename" update trick still shows
# within a day (shift-reload shows it immediately).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---- Club dashboard (internal, hidden) ---------------------------------------
# /dashboard/ is passcode-gated: its data comes from the serverless functions
# below, which refuse to answer without the DASHBOARD_KEY env var.
# Setup + env vars: DASHBOARD-SETUP.md at the repo root.

[functions]
  directory = "netlify/functions"

# Keep the dashboard out of search engines and browser caches. The site-wide
# security headers above also apply to it; only NEW keys are added here so no
# duplicate headers get sent.
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# The coach posting is a temporary hire and the thank-you pages are dead ends —
# keep all three out of search. /play is NOT listed here on purpose.
[[headers]]
  for = "/coach.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/play-thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/coach-thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex"
